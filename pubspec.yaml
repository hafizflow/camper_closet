name: flutter_extension
description: "Flutter extension"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  get:
  shared_preferences:
  flutter_screenutil:
  flutter_svg:
  flutter_spinkit:
  cached_network_image:
  shimmer: 
  exui: ^1.0.9
  smooth_page_indicator: ^2.0.1
  google_fonts: ^8.0.1
  pinput: ^6.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_inner_shadow: ^0.0.1
  image_picker: ^1.2.1
  camera: ^0.11.4
  permission_handler: ^12.0.1
  intl: ^0.20.2
  

    


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.11.1
  flutter_gen: ^5.12.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/language/
    - assets/images/
    - assets/logos/


flutter_native_splash:
  ios: true

  color: "#ffffff"
  image: assets/images/splashlogo.png

  android_12: 
    color: "#ffffff"
    image: assets/images/splash.png
    
